<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .slidezy-slide {
        padding: 30px;
        text-align: center;
      }

      .slidezy-track {
        transition: transform ease 0.5s;
      }

      .slide-1 {
        background: red;
      }

      .slide-2 {
        background: green;
      }

      .slide-3 {
        background: blue;
      }

      .slide-4 {
        background: purple;
      }

      .slide-5 {
        background: gold;
      }

      .slide-6 {
        background: silver;
      }
    </style>
  </head>
  <body>
    <div id="slider">
      <div class="slide-1">Slide 1</div>
      <div class="slide-2">Slide 2</div>
      <div class="slide-3">Slide 3</div>
      <div class="slide-4">Slide 4</div>
      <div class="slide-5">Slide 5</div>
      <div class="slide-6">Slide 6</div>
    </div>
    <!-- <div class="my-controls">
      <button class="slide-prev">Prev</button>
      <button class="slide-next">Next</button>
    </div> -->
    <script src="script.js"></script>
    <script>
      const slider = new slidezy('#slider', {
        items: 1,
        loop: true,
        speed: 500,
        // nav: true,
        // controls: true,
        // controlsText:["lui",'tien']
        // preButton: ".slide-prev",
        // nextButton: ".slide-next",
        slideBy: 1,
        // autoplayTimeout: 100,
        autoplay: true,
        // autoplayHoverPause: false,
      });
    </script>
  </body>
</html>
